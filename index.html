<!DOCTYPE html>
<html>
<head>
  <title>LEGO SQL Portfolio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    textarea {
      width: 100%;
      max-width: 800px;
      font-family: monospace;
      font-size: 14px;
      padding: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    pre {
      background: #222;
      color: #0f0;
      padding: 15px;
      margin-top: 20px;
      overflow-x: auto;
      max-width: 800px;
    }
  </style>
</head>

<body>

  <h1>LEGO SQL Interactive Demo</h1>

  <p>Run SQL queries directly against the dataset:</p>

  <textarea id="query" rows="8">
SELECT 
  year,
  COUNT(*) AS number_of_sets
FROM sets
GROUP BY year
ORDER BY year;
  </textarea>

  <br>

  <button onclick="runQuery()">Run Query</button>

  <pre id="output">Results will appear here...</pre>

  <script>
    let db;

    async function initDB() {
      const SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
      });

      const response = await fetch("data/lego.sqlite");
      const buffer = await response.arrayBuffer();

      db = new SQL.Database(new Uint8Array(buffer));

      console.log("Database loaded!");
    }

    async function runQuery() {
      const query = document.getElementById("query").value;

      try {
        const result = db.exec(query);

        if (result.length === 0) {
          document.getElementById("output").textContent = "No results returned.";
          return;
        }

        const columns = result[0].columns;
        const values = result[0].values;

        let output = columns.join(" | ") + "\n";
        output += "-".repeat(50) + "\n";

        values.forEach(row => {
          output += row.join(" | ") + "\n";
        });

        document.getElementById("output").textContent = output;

      } catch (err) {
        document.getElementById("output").textContent = err.message;
      }
    }

    initDB();
  </script>

</body>
</html>
